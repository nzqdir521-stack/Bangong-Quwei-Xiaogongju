<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>智能请假理由计算器</title>
<style>*{box-sizing:border-box}body{margin:0;background:#d9dde3;font-family:"Microsoft YaHei",sans-serif;color:#222;display:grid;place-items:center;min-height:100vh}.win{width:min(92vw,520px);background:#f5f5f5;border:1px solid #777;box-shadow:0 15px 45px #0005}.bar{background:#1676d2;color:#fff;padding:10px 14px;display:flex;justify-content:space-between}.body{padding:26px}h1{font-size:25px;text-align:center;margin:0 0 7px}.tip{text-align:center;color:#666;margin:0 0 25px}.row{margin:15px 0}label{display:block;margin-bottom:7px;font-size:14px}select,textarea{width:100%;padding:11px;border:1px solid #999;background:white;font:16px inherit}textarea{height:70px;resize:none}.btn{width:100%;padding:12px;margin-top:8px;background:#1676d2;border:1px solid #075aaa;color:#fff;font-weight:700;font-size:17px;cursor:pointer}.result{display:none;margin-top:20px;background:#fff;border:1px solid #aaa;padding:17px}.result.show{display:block}.checking{color:#666;line-height:1.9}.answer{border-top:1px solid #ddd;margin-top:10px;padding-top:13px}.days{font-size:29px;font-weight:900;color:#d52b2b;margin:8px 0}.logic{background:#fff4ce;border-left:5px solid #f3bd18;padding:10px;line-height:1.6}.next{background:#eee;color:#222;border:1px solid #888;margin-top:12px}.stamp{display:none;color:#c40000;border:4px solid #c40000;transform:rotate(-8deg);font-size:20px;font-weight:bold;padding:6px;width:max-content;margin:14px auto 0}</style></head>
<body><main class="win"><div class="bar"><span>请假助手.exe</span><span>— □ ×</span></div><div class="body"><h1>智能请假理由计算器</h1><p class="tip">基于公司利益，为您计算合理假期</p><div class="row"><label>请假理由</label><select id="reason"><option>身体不舒服</option><option>家里有事</option><option>我就是不想上班</option></select></div><div class="row"><label>详细说明</label><textarea id="detail">最近身体不舒服，想休息一天。</textarea></div><button class="btn" id="calc">开始智能计算</button><section class="result" id="result"><div class="checking" id="checking"></div><div class="answer" id="answer"></div><button class="btn next" id="next"></button><div class="stamp" id="stamp">离职手续已同步</div></section></div></main>
<script>const reason=document.querySelector('#reason'),detail=document.querySelector('#detail'),result=document.querySelector('#result'),checking=document.querySelector('#checking'),answer=document.querySelector('#answer'),next=document.querySelector('#next'),stamp=document.querySelector('#stamp');let stage=0;reason.onchange=()=>{detail.value=reason.selectedIndex===0?'最近身体不舒服，想休息一天。':reason.selectedIndex===1?'不方便说。':'我就是不想上班。'};document.querySelector('#calc').onclick=run;function run(){result.classList.add('show');stamp.style.display='none';checking.innerHTML='正在核实请假理由……<br>正在评估对公司的影响……';if(stage===0){answer.innerHTML='<div class="logic">身体不舒服 → 应当前往医院<br>医院上午即可完成检查</div><div class="days">建议请假：半天</div>';next.textContent='病得严重，无法起床';next.style.display='block'}else if(stage===1){answer.innerHTML='<div class="logic">无法起床 → 无法操作电脑<br>检测到您正在操作本软件</div><div class="days">建议请假：0天</div>';next.textContent='换个理由：家里有事'}else if(stage===2){answer.innerHTML='<div class="logic">不方便说 → 无法证明有事<br>无法证明有事 → 默认没有事情</div><div class="days">建议请假：0天</div>';next.textContent='算了，说实话'}else{answer.innerHTML='<div class="logic">“不想上班”理由真实、证据充分<br>符合长期休假条件</div><div class="days">批准假期：365天</div>';next.style.display='none';stamp.style.display='block'}}next.onclick=()=>{stage++;if(stage===1){reason.selectedIndex=0;detail.value='病情特别严重，已经无法起床。'}if(stage===2){reason.selectedIndex=1;detail.value='不方便说。'}if(stage===3){reason.selectedIndex=2;detail.value='我就是不想上班。'}run()}</script></body></html>
