<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>自动下班计算器</title>
<style>*{box-sizing:border-box}body{margin:0;background:#d4d8df;font-family:"Microsoft YaHei",sans-serif;display:grid;place-items:center;min-height:100vh;color:#222}.win{width:min(92vw,520px);background:#f4f4f4;border:1px solid #666;box-shadow:0 18px 50px #0005}.bar{padding:10px 13px;background:#176fc1;color:#fff;display:flex;justify-content:space-between}.body{padding:27px}h1{text-align:center;font-size:26px;margin:0}.sub{text-align:center;color:#777}.grid{display:grid;grid-template-columns:1fr 1fr;gap:13px;margin:24px 0}.box{background:white;border:1px solid #aaa;padding:13px}label{display:block;color:#666;font-size:13px;margin-bottom:7px}input{width:100%;font-size:21px;border:0;border-bottom:1px solid #999;outline:none}.btn{width:100%;padding:13px;background:#1876cf;color:white;border:1px solid #07589f;font-weight:bold;font-size:17px;cursor:pointer}.screen{display:none;background:#101820;color:#9df5a6;border:3px inset #888;margin-top:20px;padding:18px;font-family:Consolas,"Microsoft YaHei",monospace;min-height:245px}.screen.show{display:block}.log{line-height:1.9;color:#b9c6cc}.time{text-align:center;color:#fff;font:900 42px "Microsoft YaHei";margin:17px 0 4px}.caption{text-align:center;color:#9df5a6}.again{margin-top:16px;background:#e5e5e5;color:#111;border:1px solid #777}.final{color:#ffdf53!important;font-size:30px!important}.blink:after{content:"_";animation:b .7s infinite}.blackout{position:fixed;z-index:9999;inset:0;background:#000;color:#fff;display:none;place-items:center;text-align:center;font-size:clamp(28px,6vw,52px);font-weight:900}.blackout.on{display:grid}.blackout.dark span{display:none}@keyframes b{50%{opacity:0}}</style></head>
<body><main class="win"><div class="bar"><span>下班时间计算器 1.0</span><span>— □ ×</span></div><div class="body"><h1>智能下班时间计算器</h1><p class="sub">科学计算，拒绝无效加班</p><div class="grid"><div class="box"><label>今日上班时间</label><input value="09:00"></div><div class="box"><label>每日工作时长</label><input value="8小时"></div></div><button class="btn" id="calc">计算下班时间</button><section class="screen" id="screen"><div class="log" id="log"></div><div class="time" id="time"></div><div class="caption" id="caption"></div><button class="btn again" id="again"></button></section></div></main><div class="blackout" id="blackout"><span>程序已下班<br>您继续工作</span></div>
<script>let stage=0;const screen=document.querySelector('#screen'),log=document.querySelector('#log'),time=document.querySelector('#time'),caption=document.querySelector('#caption'),again=document.querySelector('#again'),blackout=document.querySelector('#blackout');document.querySelector('#calc').onclick=run;again.onclick=()=>{stage++;run()};function run(){screen.classList.add('show');if(stage===0){log.innerHTML='> 上班 09:00 + 工作 8小时 + 午休 1小时<br>> 计算完成';time.textContent='18:00';caption.textContent='恭喜！您可以准时下班';again.textContent='检查是否可以离开'}else if(stage===1){log.innerHTML='> 检测公司出口状态……<br>> 18:00 为下班高峰，建议错峰出行';time.textContent='19:00';caption.textContent='预计下班时间已优化';again.textContent='重新检查'}else if(stage===2){log.innerHTML='> 检测到老板18:59发起临时会议<br>> 会议预计持续1小时';time.textContent='20:00';caption.textContent='预计下班时间已更新';again.textContent='会议结束，重新计算'}else if(stage===3){log.innerHTML='> 会议产生3项新任务<br>> 每项任务预计耗时1小时';time.textContent='23:00';caption.textContent='预计下班时间已更新';again.textContent='完成任务，最终计算'}else{log.innerHTML='> 自动下班请求已收到<br>> 正在执行下班程序……';time.textContent='程序已下班';time.classList.add('final');caption.textContent='您继续工作';again.style.display='none';setTimeout(()=>blackout.className='blackout on',900);setTimeout(()=>blackout.className='blackout on dark',2100)}}</script></body></html>
